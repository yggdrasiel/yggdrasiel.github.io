<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games & Apps | yggdrasiel</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #ffb703;
      --text: #f0f6fc;
      --muted: #8b949e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 24px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      text-align: left;
    }
    .app-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 183, 3, 0.2);
    }
    .icon {
      font-size: 2.2rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }
    .desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Board Game Apps</h1>
    <p>Live companion apps and tools hosted on GitHub Pages.</p>

    <a href="/hot-streak-companion-app/" class="app-card">
      <span class="icon">🔥</span>
      <div>
        <div class="title">Hot Streak Companion App</div>
        <div class="desc">Live real-time betting, mascot tracking & score calculation for Hot Streak.</div>
      </div>
    </a>
  </div>
</body>
</html>
